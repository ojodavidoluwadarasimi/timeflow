
name: Update TIMEFLOW README Clock

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timeflow-readme-clock
  cancel-in-progress: true

jobs:
  generate-clock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Nigeria dot-matrix clock
        run: |
          mkdir -p assets

          cat > /tmp/generate_clock.py <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          now = datetime.now(ZoneInfo("Africa/Lagos"))
          time_text = now.strftime("%H:%M:%S")

          digits = {
              "0": ["01110","10001","10011","10101","11001","10001","01110"],
              "1": ["00100","01100","00100","00100","00100","00100","01110"],
              "2": ["01110","10001","00001","00010","00100","01000","11111"],
              "3": ["11110","00001","00001","01110","00001","00001","11110"],
              "4": ["00010","00110","01010","10010","11111","00010","00010"],
              "5": ["11111","10000","10000","11110","00001","00001","11110"],
              "6": ["01110","10000","10000","11110","10001","10001","01110"],
              "7": ["11111","00001","00010","00100","01000","01000","01000"],
              "8": ["01110","10001","10001","01110","10001","10001","01110"],
              "9": ["01110","10001","10001","01111","00001","00001","01110"]
          }

          dot = 12
          radius = 4
          digit_width = 5 * dot
          digit_gap = 15
          colon_width = 2 * dot

          total_width = (
              6 * digit_width +
              2 * colon_width +
              7 * digit_gap
          )

          start_x = (760 - total_width) / 2
          start_y = 33

          elements = []

          x = start_x

          for character in time_text:
              if character == ":":
                  for row in (2, 4):
                      cx = x + dot
                      cy = start_y + row * dot + radius
                      elements.append(
                          f'<circle cx="{cx}" cy="{cy}" r="{radius}" class="lit"/>'
                      )
                  x += colon_width + digit_gap
                  continue

              pattern = digits[character]

              for row_index, row in enumerate(pattern):
                  for col_index, value in enumerate(row):
                      if value == "1":
                          cx = x + col_index * dot + radius
                          cy = start_y + row_index * dot + radius

                          elements.append(
                              f'<circle cx="{cx}" cy="{cy}" r="{radius}" class="lit"/>'
                          )

              x += digit_width + digit_gap

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="760" height="150" viewBox="0 0 760 150">
          <title>TIMEFLOW Nigeria Time: {time_text}</title>
          <defs>
            <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <rect width="760" height="150" rx="16" fill="#08090c"/>
          <g fill="#e8ad4b" filter="url(#glow)">
            {''.join(elements)}
          </g>
          </svg>'''

          Path("assets/timeflow.svg").write_text(svg, encoding="utf-8")
          print(f"Generated Nigeria time: {time_text}")
          PY

          python /tmp/generate_clock.py

      - name: Commit updated clock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/timeflow.svg

          if git diff --cached --quiet; then
            echo "Clock image has not changed."
          else
            git commit -m "Update TIMEFLOW README clock"
            git push
          fi
          
