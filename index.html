<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="TIMEFLOW — a live dot-matrix clock showing Nigeria time.">
  <title>TIMEFLOW · Nigeria Time</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23080b10'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23e9ad4b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="clock-shell">
    <header class="topline">
      <a class="wordmark" href="./" aria-label="TIMEFLOW home">TIMEFLOW<span>.</span></a>
      <span class="live-indicator"><i></i> LIVE CLOCK</span>
    </header>

    <section class="clock-card" aria-label="Live clock showing Nigeria time">
      <div class="card-heading">
        <div>
          <p class="eyebrow">LOCAL TIME</p>
          <h1>Nigeria</h1>
        </div>
        <span class="timezone">WAT <b>UTC+1</b></span>
      </div>

      <div class="digital-wrap">
        <div id="digital-clock" class="digital-clock" role="timer" aria-live="off" aria-label="Loading Nigeria time">
          <span class="loading">SYNCING TIME</span>
        </div>
      </div>

      <div class="date-row">
        <span id="weekday">—</span>
        <span class="date-divider"></span>
        <span id="full-date">—</span>
      </div>

      <div class="seconds-track" aria-hidden="true">
        <div id="seconds-progress"></div>
      </div>
      <div class="card-footer">
        <span><span class="status-dot"></span> SYNCHRONIZED WITH DEVICE CLOCK</span>
        <span id="sync-status">UPDATING EVERY SECOND</span>
      </div>
    </section>

    <footer class="footer">
      <p>BUILT TO KEEP TIME. <span>DESIGNED TO KEEP MOVING.</span></p>
      <p class="footnote">Time zone: Africa/Lagos · 24-hour format</p>
    </footer>
  </main>
  <script src="./clock.js"></script>
</body>
</html>
